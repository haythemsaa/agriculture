version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agritech_postgres
    environment:
      POSTGRES_DB: agritech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agritech

  # MongoDB for logs
  mongodb:
    image: mongo:7.0
    container_name: agritech_mongodb
    environment:
      MONGO_INITDB_DATABASE: agritech_logs
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - agritech

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: agritech_redis
    ports:
      - "6379:6379"
    networks:
      - agritech

  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agritech_backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=agritech
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - MONGODB_HOST=mongodb
    depends_on:
      - postgres
      - redis
      - mongodb
    networks:
      - agritech
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Nuxt.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agritech_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - agritech
    command: npm run dev

  # Elasticsearch (for search)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: agritech_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - agritech

  # MailHog (for email testing)
  mailhog:
    image: mailhog/mailhog
    container_name: agritech_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - agritech

networks:
  agritech:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  elasticsearch_data:
